name: Brave PortableApps - Unified ZIP and NSIS PAF

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Official stable Brave version (blank = latest stable)'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish BOTH verified packages to this builder repository Releases'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: brave-unified-release
  cancel-in-progress: false

jobs:
  build:
    name: Build + test Brave ZIP and independent NSIS PAF
    runs-on: windows-2022
    timeout-minutes: 85
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout independent Brave builder
        uses: actions/checkout@v4

      - name: Set up Go for tested native launcher
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: One-workflow integration contract check
        run: python tests/test-unified-static.py

      - name: PowerShell Boolean guard regressions (before downloads)
        run: ./scripts/test-unified-guards.ps1

      - name: Go TraceGuard and launcher tests
        run: go test -count=1 ./...

      - name: Stable-release resolver regressions
        run: ./scripts/test-resolver.ps1

      - name: Official ZIP layout regressions
        run: ./scripts/test-extraction.ps1

      - name: Real-browser smoke test regressions
        run: ./scripts/test-smoke.ps1

      - name: GitHub release-check regressions
        run: ./scripts/test-release-check.ps1

      - name: Resolve latest official STABLE Brave Windows x64 ZIP
        id: upstream
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: ./scripts/resolve.ps1 -Version $env:REQUESTED_VERSION

      - name: Skip a release that already exists (no destructive overwrite)
        id: existing
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: ./scripts/check-release.ps1 -Tag $env:RELEASE_TAG

      - name: Download, SHA-256-verify and extract original Brave browser ZIP
        if: steps.existing.outputs.skip != 'true'
        timeout-minutes: 22
        run: ./scripts/download-extract.ps1

      - name: Build ONE genuine BravePortable.exe and stage ONE PortableApps folder
        if: steps.existing.outputs.skip != 'true'
        timeout-minutes: 15
        run: ./scripts/stage.ps1

      - name: Test actual Brave startup, shutdown and TraceGuard on disposable Data
        if: steps.existing.outputs.skip != 'true'
        timeout-minutes: 6
        run: ./scripts/smoke.ps1

      - name: Create ZIP from the validated staged application
        if: steps.existing.outputs.skip != 'true'
        timeout-minutes: 14
        run: ./scripts/package.ps1

      - name: Validate staged application and ZIP before installer compilation
        if: steps.existing.outputs.skip != 'true'
        timeout-minutes: 5
        run: ./scripts/validate.ps1

      - name: Build independent headless NSIS PAF using shared universal builder
        if: steps.existing.outputs.skip != 'true'
        id: installer
        timeout-minutes: 35
        uses: vhick/Portable-Package-Builder@v1.0.0
        with:
          source-dir: work/BravePortable
          output-dir: dist
          engine: custom-nsis
          running-exe: 'App\Brave\brave.exe'
          package-revision: brave-r9
          timeout-seconds: '1800'

      - name: Validate BOTH files and their checksums
        if: steps.existing.outputs.skip != 'true'
        id: packages
        timeout-minutes: 5
        env:
          INSTALLER_FILE: ${{ steps.installer.outputs.installer-file }}
          INSTALLER_SHA256: ${{ steps.installer.outputs.installer-sha256 }}
          APP_ID: ${{ steps.installer.outputs.app-id }}
          APP_VERSION: ${{ steps.installer.outputs.app-version }}
        run: ./scripts/validate-unified.ps1

      - name: Real Windows NSIS first-install and upgrade safety test
        if: steps.existing.outputs.skip != 'true'
        timeout-minutes: 16
        env:
          INSTALLER_FILE: ${{ steps.installer.outputs.installer-file }}
        run: ./scripts/test-unified-upgrade.ps1

      - name: Publisher DRY RUN - inspect exactly two validated packages
        if: steps.existing.outputs.skip != 'true' && inputs.publish
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: 'dist/*.zip;dist/*.paf.exe'
          tag: ${{ steps.upstream.outputs.tag }}
          release-title: Brave Portable ${{ steps.upstream.outputs.version }} - Unified ZIP + independent NSIS PAF (r9)
          tag-prefix: 'portable-'
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'

      - name: Publish BOTH validated files in ONE GitHub Release
        if: steps.existing.outputs.skip != 'true' && inputs.publish
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: 'dist/*.zip;dist/*.paf.exe'
          tag: ${{ steps.upstream.outputs.tag }}
          release-title: Brave Portable ${{ steps.upstream.outputs.version }} - Unified ZIP + independent NSIS PAF (r9)
          tag-prefix: 'portable-'
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'

      - name: Verify the published release contains BOTH file formats
        if: steps.existing.outputs.skip != 'true' && inputs.publish
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: ./scripts/check-published.ps1
